name: Ben Health OS CI

on:
  push:
    branches: [ben-health-os, main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "fixtures/**"
      - ".github/workflows/ben-health-os-ci.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build, test (Node workspaces)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
      - name: Test
        run: pnpm -r test

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (non-blocking report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (high+)
        run: pnpm audit --audit-level high || echo "::warning::pnpm audit reported findings — review output above"

  # iOS cannot build on Linux runners (no Xcode). The apps/ios target is
  # compiled on macOS per docs/adr/0003; add a macos-15 job here when a
  # macOS runner budget/signing setup exists.
