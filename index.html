<style>
:root{--bg:#0b0d10;--card:#151a21;--card2:#1c232c;--txt:#f5f5f2;--mut:#8f9aa8;--acc:#ffd23f;--ok:#37d67a;--bad:#ff5a5a;--blue:#4cc2ff;--line:#262e38;--brba:#7be495}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,Helvetica,Arial,sans-serif;font-size:18px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 28px);transition:background .15s}
body.flash{background:#ff5a5a}
body.flash .hero{background:#3a1010}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header .day{font-size:14px;color:var(--mut);line-height:1.25;min-width:0}
header .day b{color:var(--txt);font-size:18px}
header .clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
header .clock small{font-size:13px;color:var(--mut);font-weight:700;margin-left:3px}
.iconbtns{display:flex;gap:6px}
.ib{background:#1b2129;border:0;border-radius:10px;padding:8px 10px;font-size:17px;color:var(--txt)}
.ib.off{opacity:.45}
.gates{margin:10px 12px 0;background:#2b2a1a;border:2px solid var(--acc);border-radius:16px;padding:12px 14px;color:var(--acc);font-weight:700;font-size:17px;line-height:1.35}
.gates.hot{background:#3a1515;border-color:var(--bad);color:#ffb3b3}
.gates.hot b{color:var(--bad)}
.gates b{display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:4px;color:#d9b52e}
.sec{margin:10px 12px 0;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:800}
.hero{margin:6px 12px 8px;background:var(--card);border-radius:22px;padding:16px 16px 14px;transition:background .15s;border:2px solid transparent}
.hero.here{border-color:var(--ok)}
.hero .name{font-size:32px;font-weight:800;line-height:1.1;margin:2px 0 6px;letter-spacing:-.4px}
.hero .big{font-size:66px;font-weight:900;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.hero .big small{font-size:26px;font-weight:700;letter-spacing:0;color:var(--mut)}
.hero .big.now{color:var(--bad);animation:pulse 1s infinite}
.hero .big.warn{color:var(--acc)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.hero .big.now{animation:none}}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:6px}
.sub{font-size:17px;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1.35}
.sub b{color:var(--txt);font-weight:700}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:#2a3340;color:var(--txt);white-space:nowrap}
.chip.ok{background:var(--ok);color:#052}
.chip.bad{background:var(--bad);color:#fff}
.chip.acc{background:var(--acc);color:#221}
.chip.big{font-size:22px;padding:6px 14px}
.ww{margin-top:10px;font-size:18px;line-height:1.35}
.ww b{color:var(--mut);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-top:8px;font-weight:800}
.charge{margin-top:10px;background:#2b2a1a;border-radius:12px;padding:8px 12px;color:var(--acc);font-weight:700;font-size:17px;line-height:1.35}
.gps{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.gps b{color:var(--blue);font-size:19px}
.then{margin:0 12px 8px;background:var(--card);border-radius:18px;padding:6px 14px}
.then .tl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:18px}
.then .tl:last-child{border-bottom:0}
.then .tl .n{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.then .tl .m{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.then .tl .t{color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:8px;margin:0 12px 10px}
.actions button{flex:1;background:var(--card2);border:0;border-radius:14px;padding:14px 8px;font-weight:800;font-size:16px}
.actions button.primary{background:var(--blue);color:#032;flex:2}
.picker{margin:0 12px 10px;background:#2b1a1a;border-radius:14px;padding:12px 14px;font-size:16px;color:#f7c6c6}
.picker select{width:100%;margin-top:8px;font-size:18px;padding:12px;border-radius:12px;background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.dayend{margin:0 12px 8px;color:var(--mut);font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.dayend b{color:var(--txt)}
.list{padding:0 12px}
.stop{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;border:2px solid transparent;position:relative}
.stop.cur{border-color:var(--acc)}
.stop.here{border-color:var(--ok)}
.stop.done{opacity:.5}
.stop.done .nm{text-decoration:line-through}
.stop.skipped{opacity:.4}
.stop.skipped .nm{text-decoration:line-through}
.stop .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stop .nm{font-size:23px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.stop .nm small{color:var(--mut);font-weight:700;font-size:15px;margin-right:6px}
.stop .dur{font-size:15px;color:var(--mut);white-space:nowrap;text-align:right;line-height:1.3}
.stop .dur b{color:var(--blue);font-size:17px;display:block}
.badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:800;letter-spacing:.7px;border-radius:6px;padding:2px 7px;background:#2a3340;color:var(--txt);text-transform:uppercase}
.badge.charger{background:#3a3520;color:var(--acc)}
.badge.brba{background:#1f3a2a;color:var(--brba)}
.badge.food{background:#3a2a1f;color:#ffb27a}
.badge.hotel{background:#24303e;color:#9fd0ff}
.badge.photo{background:#2e2540;color:#d3b3ff}
.badge.sight{background:#1e343a;color:#8fe3f0}
.badge.flex{background:#333;color:#ddd;border:1px dashed #666}
.badge.cut{background:#3a1f1f;color:#ff9c9c}
.stop .tz{font-size:12px;font-weight:800;letter-spacing:.5px;color:#111;background:#c8d0da;border-radius:6px;padding:1px 5px;vertical-align:middle;margin-left:4px}
.stop .plan{font-size:17px;color:var(--mut);margin-top:5px;font-variant-numeric:tabular-nums}
.stop .plan b{color:var(--txt);font-weight:700}
.stop .proj{font-size:20px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:700}
.stop .proj .mut{color:var(--mut);font-weight:600;font-size:16px}
.stop .addr{font-size:15px;color:var(--mut);margin-top:4px}
.stop .ww{font-size:17px}
.stop .charge{font-size:16px;padding:7px 10px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;border:0;border-radius:16px;font-weight:900;font-size:28px;padding:18px 8px;letter-spacing:.3px}
.btns button.arr{background:var(--ok);color:#052}
.btns button.dep{background:var(--acc);color:#221}
.btns button.sm{font-size:16px;padding:12px 8px;background:var(--card2);color:var(--txt);font-weight:800}
.mini{display:none}
.stop.open .mini{display:flex}
details.dayblk{margin:8px 12px;background:var(--card);border-radius:18px;overflow:hidden}
details.dayblk summary{list-style:none;padding:14px 16px;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.dayblk summary::-webkit-details-marker{display:none}
details.dayblk summary small{color:var(--mut);font-weight:600;font-size:14px;display:block;margin-top:2px}
details.dayblk summary .arrow{color:var(--mut);font-size:22px;transition:.15s}
details.dayblk[open] summary .arrow{transform:rotate(90deg)}
details.dayblk .list{padding:0 8px 8px}
details.dayblk .stop{background:var(--card2)}
.foot{margin:18px 12px 8px;color:var(--mut);font-size:14px;line-height:1.55;text-align:center}
.foot b{color:var(--txt)}
.foot .rule{display:block;margin:8px auto 0;padding:10px 12px;background:var(--card);border-radius:12px;color:var(--acc);font-weight:800;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:#fff;color:#111;font-weight:800;padding:12px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9;font-size:18px;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>

/* ============ TIME ============ */
const dtfCache={};
function parts(ms,tz){const f=dtfCache['p'+tz]||(dtfCache['p'+tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}));const o={};for(const p of f.formatToParts(new Date(ms)))o[p.type]=p.value;return o;}
function tzOff(ms,tz){const p=parts(ms,tz);const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute,+p.second);return Math.round((asUTC-Math.floor(ms/1000)*1000)/60000);}
function zoned(dateStr,hm,tz){const [y,m,d]=dateStr.split('-').map(Number);const [H,M]=hm.split(':').map(Number);const guess=Date.UTC(y,m-1,d,H,M);let off=tzOff(guess,tz);let ms=guess-off*60000;const off2=tzOff(ms,tz);if(off2!==off)ms=guess-off2*60000;return ms;}
function fmtT(ms,tz){const f=dtfCache['t'+tz]||(dtfCache['t'+tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit'}));return f.format(ms).replace(' AM','a').replace(' PM','p');}
function tzAbbr(ms,tz){const f=dtfCache['z'+tz]||(dtfCache['z'+tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}));const p=f.formatToParts(ms).find(x=>x.type==='timeZoneName');return p?p.value:'';}
function fmtDelta(m){if(Math.abs(m)<1)return 'on time';return (m>0?'+':'−')+Math.abs(m)+' min '+(m>0?'behind':'ahead');}
function fmtDeltaShort(m){if(Math.abs(m)<1)return '±0';return (m>0?'+':'−')+Math.abs(m);}
function deltaClass(m){return Math.abs(m)<1?'':(m>0?(m>=10?'bad':'acc'):'ok');}
function fmtDur(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');return m+':'+String(sec).padStart(2,'0');}
function fmtMin(ms){const m=Math.round(ms/60000);if(m<60)return m+' min';return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';}

/* ============ GEO ============ */
function hav(a,b){const R=3958.8,toR=Math.PI/180;const dLat=(b.lat-a.lat)*toR,dLon=(b.lon-a.lon)*toR;const s=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}

let fixes=[];
function onFix(p){const c=p.coords,t=p.timestamp||Date.now();fixes.push({t,lat:c.latitude,lon:c.longitude});const cutoff=t-180e3;while(fixes.length>2&&fixes[0].t<cutoff)fixes.shift();
 let mph=null;if(fixes.length>=2){let dist=0;for(let i=1;i<fixes.length;i++)dist+=hav(fixes[i-1],fixes[i]);const hrs=(t-fixes[0].t)/3600e3;if(hrs>=20/3600)mph=dist/hrs;}
 if(mph==null&&c.speed!=null&&c.speed>=0)mph=c.speed*2.23694;
 gps={ok:true,lat:c.latitude,lon:c.longitude,acc:c.accuracy,mph,ts:t,err:null,watching:true};$('picker').style.display='none';}
function onGpsErr(e){gps.err=e.code===1?'GPS denied':e.code===2?'no fix':'GPS timeout';gps.watching=true;if(!gps.ok)showPicker();}

function distTo(stop){if(!gps.ok||!stop)return null;return hav(gps,{lat:stop.lat,lon:stop.lon});}
function etaTo(stop){const dist=distTo(stop);if(dist==null)return null;const road=dist*ROAD;let ms,est=false;if(gps.mph!=null&&gps.mph>8)ms=road/gps.mph*3600e3;else{ms=road/FALLBACK_MPH*3600e3;est=true;}return {dist,ms,est};}

/* ============ SCHEDULE ENGINE ============ */
function computeDay(day,now){
 const st=day.stops.map(s=>{const A=s.t?zoned(day.date,s.t,s.z):null;let arr=S.arr[s.key]||null,dep=S.dep[s.key]||null,skip=!!S.skip[s.key];
  if(s.done&&!arr&&!dep&&A!=null){arr=A;dep=A+(s.min||0)*60000;}   // pre-marked done from the plan
  if(s.skipped&&!skip)skip=true;
  return Object.assign({},s,{A,D:A!=null?A+(s.min||0)*60000:null,arr,dep,skip});});
 const timed=st.filter(s=>s.A!=null);
 const live=timed.length>0&&now>=timed[0].A-3*3600e3&&now<=timed[timed.length-1].D+8*3600e3;
 let cur=st.findIndex(s=>!s.dep&&!s.skip&&!(s.cut&&s.A==null));if(cur<0)cur=st.length;
 const mode=cur>=st.length?'done':((st[cur].arr||st[cur].origin)?'here':'driving');
 const target=mode==='here'?cur+1:cur;
 const eta=live?etaTo(st[target]):null;
 let prevDep=null,prevD=null;
 st.forEach((s,i)=>{
  if(s.A==null){s.status=s.dep?'done':s.skip?'skipped':'future';s.pa=s.pd=s.due=null;s.delta=0;s.depDelta=0;return;}
  const L=(prevDep!=null&&prevD!=null)?s.A-prevD:0;prevD=s.D;
  let pa;
  if(s.skip&&!s.arr&&!s.dep){pa=prevDep!=null?prevDep+L:s.A;s.pa=pa;s.pd=pa;s.due=pa;s.delta=Math.round((pa-s.A)/60000);s.depDelta=s.delta;s.status='skipped';prevDep=pa;return;}
  if(s.arr)pa=s.arr;
  else if(s.origin)pa=s.A;
  else{pa=prevDep!=null?prevDep+L:s.A;if(live&&eta&&!eta.est&&i===target&&mode==='driving')pa=now+eta.ms;if(live&&!s.dep)pa=Math.max(pa,now);}
  let due=(s.arr||s.A)+(s.min||0)*60000;if(s.origin)due=s.A;
  let pd;
  if(s.dep)pd=s.dep;
  else if(s.arr||s.origin){pd=due;if(live)pd=Math.max(pd,now);}
  else pd=pa+(s.min||0)*60000;
  s.pa=pa;s.pd=pd;s.due=due;
  s.delta=Math.round((s.origin?pd-s.D:pa-s.A)/60000);
  s.depDelta=Math.round((pd-s.D)/60000);
  s.status=s.dep?'done':i===cur?mode:'future';
  prevDep=pd;
 });
 const timedEnd=[...st].reverse().find(s=>s.A!=null)||null;
 return {day,st,cur,mode,target,live,eta,end:timedEnd,next:st[target]||null,curStop:st[cur]||null};
}
function autoDay(){const now=Date.now();let pick=DAYS[0].n;for(const d of DAYS){if(d.cutlist)continue;const first=d.stops.find(s=>s.t);const t0=zoned(d.date,first.t,first.z);if(now>=t0-3*3600e3)pick=d.n;}return pick;}

 if(s.A==null)return s.status==='done'?`<span class="mut">done ${fmtT(s.dep,s.z)}</span>`:'';
 if(s.status==='skipped')return `<span class="mut">skipped · pass ~${fmtT(s.pa,s.z)}</span>`;
 if(s.dep)return `<span class="mut">was</span> ${fmtT(s.arr||s.A,s.z)}${s.origin?' '+fmtT(s.dep,s.z):' → '+fmtT(s.dep,s.z)} <span class="chip ${deltaClass(s.delta)}">${fmtDeltaShort(s.origin?Math.round((s.dep-s.A)/60000):s.delta)}</span>`;
 if(s.status==='here')return (s.origin?'':`<span class="mut">arrived</span> ${fmtT(s.arr,s.z)} · `)+`<span class="mut">leave</span> ${fmtT(s.pd,s.z)} <span class="chip ${deltaClass(s.depDelta)}">${fmtDeltaShort(s.depDelta)}</span>`;
 return `<span class="mut">proj</span> ${fmtT(s.pa,s.z)}${s.origin||!s.min?'':' → '+fmtT(s.pd,s.z)} <span class="chip ${deltaClass(s.delta)}">${fmtDeltaShort(s.delta)}</span>`;
}

let lastAuto=0;
function tick(){
 const now=Date.now();const day=dayByN(selDay);const c=computeDay(day,now);
 const zs=(c.next||c.curStop||c.end)||{z:PHX};
 $('clock').textContent=fmtT(now,zs.z);$('clocktz').textContent=tzAbbr(now,zs.z);
 const others={};
 for(const k in cardEls){const ce=cardEls[k];let cc=c;if(ce.other!=null){cc=others[ce.other]||(others[ce.other]=computeDay(dayByN(ce.other),now));}
  const s=cc.st.find(x=>x.key===k);if(!s)continue;
  ce.proj.innerHTML=projHTML(s);
  const d=(!s.dep&&!s.skip)?distTo(s):null;ce.mi.textContent=d!=null?fmtMi(d)+' mi':'';
  const wantOpen=ce.el.classList.contains('open');ce.el.className=statusClass(s,cc,ce.other==null)+(wantOpen?' open':'');}
 if(c.end){if(c.mode==='done')$('dayend').innerHTML=`Day ${day.n} complete ✓ · finished ${fmtT(c.end.dep,c.end.z)}`;
 else $('dayend').innerHTML=`Day ends <b>${fmtT(c.end.pa,c.end.z)} ${tzAbbr(c.end.pa,c.end.z)}</b> · <span class="chip ${deltaClass(c.end.delta)}">${fmtDelta(c.end.delta)}</span>`;}else $('dayend').innerHTML='';
 renderHero(c,now);renderThen(c);
 // auto arrive / auto done (today only, decent fix)
 if(c.live&&gps.ok&&(gps.acc||999)<400&&selDay===autoDay()&&now-lastAuto>4000){
  const cs=c.curStop;
  if(cs&&c.mode==='driving'){const d=distTo(cs);const nx=c.st[c.cur+1];const d2=nx?distTo(nx):null;
   if(d!=null&&d<NEAR_MI){lastAuto=now;mark(cs.key,'arr',true);}
   else if(d2!=null&&d2<NEAR_MI&&d>NEAR_MI*4){lastAuto=now;S.skip[cs.key]=1;save();mark(nx.key,'arr',true);}}
  else if(cs&&c.mode==='here'){const d=distTo(cs);if(d!=null&&d>AWAY_MI&&(gps.mph==null||gps.mph>5||cs.origin)){lastAuto=now;mark(cs.key,'dep',true);}}
 }
 // alerts
 if(c.live&&c.mode==='here'&&c.curStop&&((c.curStop.min>0)||c.curStop.origin)&&selDay===autoDay()){
  const s=c.curStop;const rem=s.due-now;const k5=s.key+':5',k0=s.key+':0';
  if(rem<=0&&!S.ack[k0]){S.ack[k0]=1;S.ack[k5]=1;save();alarm(0);}
  else if(rem<=5*60e3&&rem>0&&!S.ack[k5]){S.ack[k5]=1;save();alarm(5);}
 }
 $('gpsBtn').textContent=gps.ok?`📍 ${gps.mph!=null?Math.round(gps.mph)+' mph':'fix'}`:(gps.err?'📍 '+gps.err:(gps.watching?'📍 …':'📍 Locate'));
}

function renderHero(c,now){
 const h=$('hero');let html='';const cs=c.curStop,nx=c.next;
 h.classList.toggle('here',c.mode==='here');
 if(c.mode==='done'){html=`<div class="name">All stops done 🏁</div><div class="big">✓</div>${c.end&&c.end.dep?`<div class="sub">Finished <b>${fmtT(c.end.dep,c.end.z)}</b> · ${fmtDelta(Math.round((c.end.dep-c.end.A)/60000))}</div>`:''}`;}
 else if(!c.live){const first=c.st.find(s=>s.A!=null)||cs;const until=first.A!=null?first.A-now:null;
  html=`<div class="sub">${c.day.cutlist?'Optional list':'Day '+c.day.n+' starts with'}</div><div class="name">${esc(first.name)}</div><div class="badges">${badge(first)}</div>${until!=null?`<div class="big">${until>0?fmtMin(until):'—'}</div><div class="sub">${until>0?'until ':'planned '}<b>${fmtT(first.A,first.z)} ${tzAbbr(first.A,first.z)}</b> · ${c.st.length} stops${c.end?` · ends <b>${fmtT(c.end.A,c.end.z)}</b>`:''}</div>`:''}${ww(first)}`;}
 else if(c.mode==='here'){const rem=cs.due-now;const cls=rem<=0?'now':rem<=5*60e3?'warn':'';
  html=`<div class="sub">${cs.origin?'Departure':'You are at'}</div><div class="name">${esc(cs.name)}</div><div class="badges">${badge(cs)}</div>
  <div class="big ${cls}">${rem<=0?'LEAVE NOW':fmtDur(rem)}</div>
  <div class="row"><span class="sub">leave <b>${fmtT(cs.pd,cs.z)}</b> (plan ${fmtT(cs.D,cs.z)})</span><span class="chip big ${deltaClass(cs.depDelta)}">${fmtDelta(cs.depDelta)}</span></div>${chargeLine(cs)}`;
  if(nx){const e=c.eta;html+=`<div class="sub" style="margin-top:10px">next <b>${esc(nx.name)}</b>${e?` · ${fmtMi(e.dist)} mi`:''}${nx.A!=null?` · arrive ~<b>${fmtT(nx.pa,nx.z)}</b> (plan ${fmtT(nx.A,nx.z)})`:''}</div>`;}
 }else{const e=c.eta;
  html=`<div class="sub">Next stop</div><div class="name">${esc(cs.name)}</div><div class="badges">${badge(cs)}</div>`;
  if(e){html+=`<div class="big">${fmtMi(e.dist)}<small> mi</small></div><div class="row"><span class="sub">ETA <b>${fmtT(now+e.ms,cs.z)}</b> ${e.est?`<span style="font-size:13px">(@${FALLBACK_MPH} mph est)</span>`:`· ${fmtMin(e.ms)}`} · plan ${fmtT(cs.A,cs.z)}</span><span class="chip big ${deltaClass(cs.delta)}">${fmtDelta(cs.delta)}</span></div>`;}
  else{html+=`<div class="big">${fmtT(cs.pa,cs.z)}</div><div class="row"><span class="sub">projected arrival (plan ${fmtT(cs.A,cs.z)}) · ${gps.err||'waiting for GPS…'}</span><span class="chip big ${deltaClass(cs.delta)}">${fmtDelta(cs.delta)}</span></div>`;}
  html+=`<div class="sub" style="margin-top:4px">${esc(cs.addr)}${cs.min?` · stay ${cs.min} min · leave by <b>${fmtT(cs.pd,cs.z)}</b>`:''}</div>${chargeLine(cs)}${ww(cs)}`;
 }
 if(gps.ok){html+=`<div class="gps"><span><b>${gps.mph!=null?Math.round(gps.mph):'–'}</b> mph avg</span><span>±${Math.round(gps.acc||0)} m</span><span>${c.eta?`≈${(c.eta.dist*ROAD).toFixed(0)} road mi`:''}</span></div>`;}
 else if(c.live){html+=`<div class="gps"><span>${gps.err?gps.err:'📍 acquiring GPS…'}</span><span>tap 📍 to retry</span></div>`;}
 h.innerHTML=html;
}
function renderThen(c){
 const el=$('then');const items=[];
 for(let i=c.cur+1;i<c.st.length&&items.length<3;i++){const s=c.st[i];if(s.skip||s.dep)continue;const d=distTo(s);
  items.push(`<div class="tl"><span class="t">${s.A!=null?fmtT(s.pa,s.z):'—'}</span><span class="n">${esc(s.name)}${s.target!=null?` <span style="color:var(--acc)">⚡${s.target}%</span>`:''}${s.flex?' <span style="color:var(--mut)">(opt)</span>':''}</span><span class="m">${d!=null?fmtMi(d)+' mi':(s.min?s.min+' min':'')}</span></div>`);}
 el.innerHTML=items.length?items.join(''):'<div class="tl"><span class="n" style="color:var(--mut)">nothing after this — day complete</span></div>';
}

/* ============ STATUS LINE ============ */
function statusLine(){
 const day=dayByN(selDay);const now=Date.now();const c=computeDay(day,now);
 const cs=c.curStop,nx=c.next;const z=(nx||cs||c.end||{z:PHX}).z;
 let s=`${day.dow} ${fmtT(now,z)} ${tzAbbr(now,z)}`;
 if(c.mode==='done')return s+` — Day ${day.n} done${c.end&&c.end.dep?`, finished ${fmtT(c.end.dep,c.end.z)} (${fmtDelta(Math.round((c.end.dep-c.end.A)/60000))})`:''}.`;
 if(!c.live){const f=c.st.find(x=>x.A!=null);return f?s+` — Day ${day.n} starts ${fmtT(f.A,f.z)} ${tzAbbr(f.A,f.z)}, ${c.st.length} stops, ends ~${fmtT(c.end.A,c.end.z)}.`:s;}
 if(c.mode==='here'){s+=` — AT ${cs.name}${cs.arr&&!cs.origin?` (arr ${fmtT(cs.arr,cs.z)}, ${fmtDeltaShort(cs.delta)})`:''}, leaving ~${fmtT(cs.pd,cs.z)} (${fmtDelta(cs.depDelta)})`;
  if(nx)s+=`; next ${nx.name}${nx.A!=null?` ~${fmtT(nx.pa,nx.z)}`:''}${c.eta?` (${fmtMi(c.eta.dist)} mi)`:''}`;}
 else{s+=` — EN ROUTE to ${cs.name}${c.eta?`, ${fmtMi(c.eta.dist)} mi, ETA ${fmtT(now+c.eta.ms,cs.z)}`:`, ETA ~${fmtT(cs.pa,cs.z)}`} (${fmtDelta(cs.delta)})`;
  const after=c.st[c.cur+1];if(after&&after.A!=null)s+=`; then ${after.name} ~${fmtT(after.pa,after.z)}`;}
 if(c.end)s+=`. Day ends ~${fmtT(c.end.pa,c.end.z)} ${tzAbbr(c.end.pa,c.end.z)} (${fmtDelta(c.end.delta)}).`;
 return s;
}
async function copyStatus(){const txt=statusLine();try{await navigator.clipboard.writeText(txt);toast('Copied ✓');}catch(e){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();toast('Copied ✓');}catch(e2){prompt('Copy:',txt);}}}
async function shareStatus(){const text=statusLine();if(navigator.share){try{await navigator.share({text});}catch(e){}}else copyStatus();}

/* ============ WIRING ============ */
$('copyBtn').onclick=copyStatus;$('shareBtn').onclick=shareStatus;
$('gpsBtn').onclick=()=>{unlockAudio();gps.watching=false;startGps();locateOnce();toast('Locating…');};
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();unlockAudio();updIcons();if(S.sound){beep(1);toast('Sound on');}else toast('Sound off');};
$('awakeBtn').onclick=()=>{S.awake=!S.awake;save();updIcons();if(S.awake)keepAwake();else if(wakeLock){wakeLock.release();wakeLock=null;}toast(S.awake?'Screen stays awake':'Screen may sleep');};
$('cfgBtn').onclick=()=>{
 const a=prompt('Settings:\n1 = jump to a day (2, 2.5, 3–6)\n2 = reset Day '+selDay+' marks\n3 = reset ALL marks\n4 = test alarm\n5 = back to today','');
 if(a==='1'){const d=prompt('Day number (2, 2.5, 3, 4, 5, 6)',String(selDay));if(d&&dayByN(+d)){selDay=+d;render();}}
 else if(a==='2'){if(confirm('Reset all marks for Day '+selDay+'?')){for(const m of ['arr','dep','ack','skip'])for(const k of Object.keys(S[m]))if(k.startsWith(selDay+':'))delete S[m][k];save();render();toast('Day reset');}}
 else if(a==='3'){if(confirm('Reset EVERYTHING?')){S.arr={};S.dep={};S.ack={};S.skip={};save();render();toast('All reset');}}
 else if(a==='4'){unlockAudio();setTimeout(()=>alarm(0),300);}
 else if(a==='5'){selDay=autoDay();render();}
};
function updIcons(){$('soundBtn').textContent=S.sound?'🔔':'🔕';$('soundBtn').classList.toggle('off',!S.sound);$('awakeBtn').classList.toggle('off',!S.awake);}
document.addEventListener('touchend',()=>{unlockAudio();keepAwake();},{passive:true});
document.addEventListener('click',()=>{unlockAudio();keepAwake();});
$('foot').innerHTML=`<span class="rule">A Supercharger exists when the car’s nav lists it, not when a website says so.</span>
<b>Doctrine:</b> arrival floor 20% · charge to 85–90% before legs &gt;120 mi · never plan above 85 mph · Superchargers only · touchless washes only (rear-quarter scrape).<br>
No Supercharger in Seligman (nearest Williams, 301 N 7th St, 12 stalls) · none in Winslow (anchor = Holbrook) · Grants was never built.<br>
Times in each stop’s own zone. Miles straight-line (ETA ×${ROAD} road). Auto-✓ within ${NEAR_MI} mi then moving away; every card also has manual ✓ / Skip / Undo. Marks live on this phone. Add to Home Screen for full-screen + offline.`;

updIcons();
render();
startGps();
setInterval(tick,1000);
setInterval(locateOnce,60000);
setInterval(()=>{const a=autoDay();if(a!==selDay&&selDay!==2.5&&selDay<a){selDay=a;render();}},60000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
