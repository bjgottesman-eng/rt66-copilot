# Ben Health OS — iOS app (XcodeGen spec)
#
# Build (macOS + Xcode 16+ required; there is no Linux toolchain for this app):
#   brew install xcodegen        # once
#   cd apps/ios
#   xcodegen generate            # writes BenHealthOS.xcodeproj (gitignored)
#   open BenHealthOS.xcodeproj   # then Cmd-R (app) / Cmd-U (tests)
#
# The Info.plist and entitlements files are generated from the `info:` and
# `entitlements:` blocks below — do not hand-edit the generated files.

name: BenHealthOS

options:
  bundleIdPrefix: com.benhealth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"                 # language mode 5 on the Swift 6 toolchain
    SWIFT_STRICT_CONCURRENCY: complete   # migrate to SWIFT_VERSION 6.0 once compiled on macOS
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  BenHealthOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benhealth.os
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        # App configuration surfaced to AppConfig via Info.plist (below).
        # Flip BH_DEMO_MODE to NO (and point BH_PLATFORM_BASE_URL at the real
        # platform) to run against services/platform instead of bundled fixtures.
        BH_PLATFORM_BASE_URL: "http://localhost:8787"
        BH_DEMO_MODE: "YES"
        # Signing is intentionally left to the developer's local Xcode
        # (Signing & Capabilities tab, or an xcconfig). HealthKit on a physical
        # device requires a team with the HealthKit capability enabled.
        CODE_SIGN_STYLE: Automatic
    info:
      path: BenHealthOS-Info.plist
      properties:
        CFBundleDisplayName: Ben Health OS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # HealthKit usage strings (required alongside the entitlement).
        NSHealthShareUsageDescription: >-
          Ben Health OS reads blood pressure and heart rate measurements from
          Apple Health so your readings from connected cuffs and apps appear in
          one place, with their original source and measurement time.
        NSHealthUpdateUsageDescription: >-
          When you turn on "Also save to Apple Health", Ben Health OS writes the
          blood pressure readings you enter manually into Apple Health, tagged
          so they are never re-imported as duplicates.
        NSFaceIDUsageDescription: >-
          Ben Health OS locks your health data behind Face ID / device
          authentication.
        # Background modes: 'processing' per the Phase 1 spec (future
        # BGProcessingTask sync). HealthKit background delivery itself is
        # granted by the entitlement below, not a UIBackgroundMode.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.benhealth.os.sync
        # OAuth redirect back into the app (ASWebAuthenticationSession).
        CFBundleURLTypes:
          - CFBundleURLName: com.benhealth.os.oauth
            CFBundleURLSchemes:
              - benhealth
        # Dev convenience: the platform runs on http://localhost:8787.
        # NSAllowsLocalNetworking keeps ATS strict for everything non-local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Read by App/AppConfig.swift.
        BHPlatformBaseURL: $(BH_PLATFORM_BASE_URL)
        BHDemoMode: $(BH_DEMO_MODE)
    entitlements:
      path: BenHealthOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  BenHealthOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.benhealth.os.tests
    dependencies:
      - target: BenHealthOS

schemes:
  BenHealthOS:
    build:
      targets:
        BenHealthOS: all
        BenHealthOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BenHealthOSTests
    profile:
      config: Release
    archive:
      config: Release
